<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Profile</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 35px 45px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: #333333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #666666;
            margin-bottom: 20px;
        }
        ul {
            list-style: none;
            padding: 0;
            text-align: left;
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 15px 20px;
        }
        li {
            padding: 8px 0;
            color: #444444;
            border-bottom: 1px solid #e9ecef;
        }
        li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>สวัสดีครับ/ค่ะ</h1>
        <p>นี่คือเว็บโปรไฟล์ของฉันบน GitHub</p>
        <ul>
            <li><strong>ชื่อเล่น:</strong> [ชื่อเล่นของคุณ]</li>
            <li><strong>สิ่งที่กำลังเรียน:</strong> GitHub Desktop</li>
        </ul>
    </div>
</body>
</html>
